name: Refresh catalog and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'online/**'
      - '!online/provenance-lock.json'
      - '.github/workflows/pages.yml'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      bootstrap_release:
        description: 'First deployment only: release tag containing steam-feature-atlas-bootstrap.tar.gz'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: steam-feature-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pages: read
    outputs:
      new_responses: ${{ steps.journals.outputs.count }}
    steps:
      - name: Mark the run start for response archiving
        run: echo "RUN_STARTED=$(date -u +%Y%m%dT%H%M%S)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install collector dependencies
        run: npm ci --ignore-scripts
        working-directory: online
      - name: Test query engine, importer and integrity checks
        run: npm test
        working-directory: online
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Require an existing completed catalog for normal refreshes
        if: ${{ !inputs.bootstrap_release }}
        run: node scripts/verify-site.mjs --published-url "$PAGES_BASE_URL"
        working-directory: online
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Download the completed first-deployment package
        if: ${{ inputs.bootstrap_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BOOTSTRAP_RELEASE: ${{ inputs.bootstrap_release }}
        run: |
          mkdir -p online/.cache/bootstrap-download online/dist
          gh release download "$BOOTSTRAP_RELEASE" --pattern steam-feature-atlas-bootstrap.tar.gz --dir online/.cache/bootstrap-download
          tar --extract --gzip --file online/.cache/bootstrap-download/steam-feature-atlas-bootstrap.tar.gz --directory online/dist --no-same-owner --no-same-permissions
      - name: Restore upstream Git object cache
        if: ${{ !inputs.bootstrap_release }}
        uses: actions/cache@v4
        with:
          path: online/.cache/bluebox
          key: steam-appdetails-v1-${{ github.run_id }}
          restore-keys: steam-appdetails-v1-
      - name: Restore interrupted refresh checkpoint
        if: ${{ !inputs.bootstrap_release }}
        uses: actions/cache/restore@v4
        with:
          path: |
            online/.cache/steam-refresh-state.json
            online/.cache/steam-responses
            online/.cache/steam-data/steam.sqlite*
            online/.cache/steam-achievements/state.sqlite*
            online/.cache/steam-achievements/responses/
          key: steam-refresh-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            steam-refresh-v3-
            steam-refresh-v2-
            steam-refresh-v1-
      # The playtime job runs in parallel and saves its working state when it finishes, so
      # this restores the previous run's measurements (a one-day lag) for publication.
      - name: Restore the review playtime job's latest working state
        if: ${{ !inputs.bootstrap_release }}
        uses: actions/cache/restore@v4
        with:
          path: online/.cache/review-playtime-refresh/state.json.gz
          key: review-playtime-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: review-playtime-v1-
      - name: Import pinned bulk sources and build
        if: ${{ !inputs.bootstrap_release }}
        run: npm run build
        working-directory: online
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          STEAM_REFRESH_LIMIT: '4000'
          STEAM_REQUEST_SPACING_MS: '5000'
          STEAM_ALLOW_BOOTSTRAP: '0'
          STEAM_ACHIEVEMENT_REQUEST_SPACING_MS: '1000'
          STEAM_ACHIEVEMENT_REQUEST_LIMIT: '2000'
          STEAM_ACHIEVEMENT_TIME_LIMIT_MS: '1800000'
      - name: Save refresh progress, including failed runs
        if: ${{ always() && !inputs.bootstrap_release }}
        uses: actions/cache/save@v4
        with:
          path: |
            online/.cache/steam-refresh-state.json
            online/.cache/steam-responses
            online/.cache/steam-data/steam.sqlite*
            online/.cache/steam-achievements/state.sqlite*
            online/.cache/steam-achievements/responses/
          key: steam-refresh-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve complete Steam response journals, including failed builds
        if: ${{ always() && !inputs.bootstrap_release }}
        uses: actions/upload-artifact@v4
        with:
          name: steam-responses-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            online/.cache/steam-responses/*.json.gz
            online/.cache/steam-achievements/responses/*.json.gz
          if-no-files-found: ignore
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
      # The cache carries earlier journals forward, so select only responses fetched
      # during this run. Journal names start with the UTC fetch time (YYYYMMDDTHHMMSS).
      - name: Collect this run's response journals for the private archive
        id: journals
        if: ${{ always() && !inputs.bootstrap_release }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/new-responses"
          count=0
          for source in steam-responses:online/.cache/steam-responses steam-achievements:online/.cache/steam-achievements/responses; do
            label="${source%%:*}" dir="${source#*:}"
            [ -d "$dir" ] || continue
            mkdir -p "$out/$label"
            while IFS= read -r -d '' file; do
              name="$(basename "$file")"
              if [[ ! "${name:0:15}" < "$RUN_STARTED" ]]; then cp -p "$file" "$out/$label/"; count=$((count + 1)); fi
            done < <(find "$dir" -maxdepth 1 -type f -name '*.json.gz' -print0)
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count response journals fetched since $RUN_STARTED"
          if [ "$count" -gt 0 ]; then tar -cf "$RUNNER_TEMP/steam-responses-${{ github.run_id }}-${{ github.run_attempt }}.tar" -C "$out" .; fi
      - name: Hand this run's journals to the archive job
        if: ${{ always() && !inputs.bootstrap_release && steps.journals.outputs.count != '0' && steps.journals.outputs.count != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: new-steam-responses-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/steam-responses-${{ github.run_id }}-${{ github.run_attempt }}.tar
          compression-level: 0
          retention-days: 7
      - name: Verify production data, checksums and completed refresh state
        run: node --max-old-space-size=4096 scripts/verify-site.mjs
        working-directory: online
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: online/dist
      - name: Upload small provenance lock
        uses: actions/upload-artifact@v4
        with:
          name: catalog-provenance
          path: online/dist/provenance-lock.json
          retention-days: 7

  # Review playtime runs beside the build on its own runner and daily budget. Its working
  # state reaches the next build through the Actions cache (a one-day lag) and its
  # responses go to the private archive. It never blocks or delays deployment.
  playtime:
    if: ${{ !inputs.bootstrap_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    outputs:
      new_responses: ${{ steps.journals.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: online
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Restore the latest working state
        uses: actions/cache/restore@v4
        with:
          path: online/.cache/review-playtime-refresh/state.json.gz
          key: review-playtime-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: review-playtime-v1-
      - name: Measure due games within the daily budget
        run: node scripts/refresh-review-playtime.mjs
        working-directory: online
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          STEAM_PLAYTIME_REQUEST_LIMIT: '500'
          STEAM_PLAYTIME_TIME_LIMIT_MS: '900000'
          STEAM_PLAYTIME_REQUEST_SPACING_MS: '1200'
      - name: Save the working state, including failed runs
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: online/.cache/review-playtime-refresh/state.json.gz
          key: review-playtime-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Collect this run's response journals
        id: journals
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          dir=online/.cache/review-playtime-refresh/responses count=0
          if [ -d "$dir" ]; then count="$(find "$dir" -maxdepth 1 -type f -name '*.json.gz' | wc -l)"; fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count review playtime responses"
          if [ "$count" -gt 0 ]; then tar -cf "$RUNNER_TEMP/steam-playtime-responses-${{ github.run_id }}-${{ github.run_attempt }}.tar" -C "$dir" .; fi
      - name: Hand the journals to the archive job
        if: ${{ always() && steps.journals.outputs.count != '0' && steps.journals.outputs.count != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: new-steam-responses-playtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/steam-playtime-responses-${{ github.run_id }}-${{ github.run_attempt }}.tar
          compression-level: 0
          retention-days: 7

  # Raw responses are kept privately and durably; artifacts expire and caches can be evicted.
  # A failure here marks the run failed but never blocks or undoes the deployment.
  archive-responses:
    needs: [build, playtime]
    if: ${{ always() && ((needs.build.outputs.new_responses != '' && needs.build.outputs.new_responses != '0') || (needs.playtime.outputs.new_responses != '' && needs.playtime.outputs.new_responses != '0')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Download the build's journals
        if: ${{ needs.build.outputs.new_responses != '' && needs.build.outputs.new_responses != '0' }}
        uses: actions/download-artifact@v4
        with:
          name: new-steam-responses-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          path: journals
      - name: Download the playtime job's journals
        if: ${{ needs.playtime.outputs.new_responses != '' && needs.playtime.outputs.new_responses != '0' }}
        uses: actions/download-artifact@v4
        with:
          name: new-steam-responses-playtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: journals
      - name: Upload to the private data archive
        shell: bash
        working-directory: journals
        env:
          GH_TOKEN: ${{ secrets.DATA_ARCHIVE_TOKEN }}
          ARCHIVE_REPO: PeterTh/steamfeatures-data
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::error::DATA_ARCHIVE_TOKEN is not set"; exit 1; fi
          tag="responses-$(date -u +%Y-%m)"
          if ! gh release view "$tag" --repo "$ARCHIVE_REPO" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$ARCHIVE_REPO" --title "Steam responses $(date -u +%Y-%m)" \
              --notes "Raw Steam response journals from daily workflow runs: one tar per job and run, named by run ID and attempt, with a SHA-256 file."
          fi
          for name in *.tar; do
            sha256sum "$name" > "$name.sha256"
            gh release upload "$tag" "$name" "$name.sha256" --repo "$ARCHIVE_REPO" --clobber
            uploaded="$(gh release view "$tag" --repo "$ARCHIVE_REPO" --json assets --jq ".assets[] | select(.name == \"$name\") | .size")"
            if [ "$uploaded" != "$(stat -c %s "$name")" ]; then echo "::error::Uploaded size of $name does not match"; exit 1; fi
            echo "Archived $name ($uploaded bytes) in $ARCHIVE_REPO release $tag"
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4

  record-provenance:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: catalog-provenance
          path: downloaded-provenance
      - name: Record only the successfully deployed source revisions
        shell: bash
        run: |
          cp downloaded-provenance/provenance-lock.json online/provenance-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- online/provenance-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Record deployed catalog provenance [skip ci]"
            git push origin HEAD:main
          fi
